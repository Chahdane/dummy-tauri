name: Bootstrap Windows validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install pinned Tauri CLI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p tauri-cli-download
          gh release download tauri-cli-v2.10.1 \
            --repo tauri-apps/tauri \
            --pattern cargo-tauri-x86_64-pc-windows-msvc.zip \
            --dir tauri-cli-download
          unzip -q tauri-cli-download/cargo-tauri-x86_64-pc-windows-msvc.zip -d tauri-cli-download
          cp tauri-cli-download/cargo-tauri.exe "$USERPROFILE/.cargo/bin/cargo-tauri.exe"
          cargo tauri --version

      - name: Validate and build
        shell: bash
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
          cargo tauri build --no-sign
