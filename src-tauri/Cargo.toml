[package]
name = "dummy-tauri"
version = "1.0.0"
description = "Minimal Tauri v2 delta updater demonstration"
authors = ["Chahdane"]
edition = "2021"
rust-version = "1.88"
publish = false

[lib]
name = "dummy_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-updater = "=2.10.1"
tauri-plugin-updater-delta = "0.1.0"
