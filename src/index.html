<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DummyTauri</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="main.js" defer></script>
  </head>
  <body>
    <main class="card">
      <img class="logo" src="icon-source.png" alt="DummyTauri updater icon" />
      <p class="eyebrow">TAURI DELTA UPDATER</p>
      <h1>DummyTauri</h1>
      <dl>
        <div>
          <dt>Version</dt>
          <dd id="version">Loading…</dd>
        </div>
        <div>
          <dt>Build</dt>
          <dd id="build-label">Loading…</dd>
        </div>
      </dl>
      <button id="check-updates" type="button">Check for updates</button>
      <section id="progress" class="progress" hidden>
        <div class="progress-head">
          <span id="progress-phase">Checking for updates…</span>
          <span id="progress-size"></span>
        </div>
        <div class="track" role="progressbar" aria-labelledby="progress-phase">
          <div id="progress-fill" class="fill indeterminate"></div>
        </div>
        <p id="progress-detail" class="progress-detail"></p>
      </section>
      <p id="status" role="status" aria-live="polite">Loading last result…</p>
    </main>
  </body>
</html>
